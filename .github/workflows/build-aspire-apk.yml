name: Build Aspire Academy APK

on:
  push:
    paths:
      - "aspire-science-academy/**"
      - ".github/workflows/build-aspire-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aspire-science-academy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: aspire-science-academy

      # Optional: instead of committing app/google-services.json you can store it
      # (base64) as the repository secret ASPIRE_GOOGLE_SERVICES_JSON.
      - name: Add Firebase config from secret
        env:
          GSJ: ${{ secrets.ASPIRE_GOOGLE_SERVICES_JSON }}
        if: env.GSJ != ''
        run: echo "$GSJ" | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            echo "::group::Compile errors"; grep -E "^e: " build.log || true; echo "::endgroup::"
            exit 1
          }

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aspire-Science-Academy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aspire-Science-Academy-apk
          path: aspire-science-academy/Aspire-Science-Academy.apk

      # Always-available download link: Releases -> "aspire-latest"
      - name: Publish APK to the latest release
        if: github.ref == 'refs/heads/claude/aspire-academy-android-app-h4ezbw' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aspire-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create aspire-latest Aspire-Science-Academy.apk --repo "$GITHUB_REPOSITORY" \
            --title "Aspire Science Academy (latest APK)" \
            --notes "Latest build from commit $GITHUB_SHA" --prerelease --target "$GITHUB_SHA"
