name: Build APK

on:
  push:
    paths-ignore: ['coaching-saas/**', '.github/workflows/coaching-saas-*.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: store THIS app's google-services.json (base64) as a repository secret named
      # ELEMENTS_GOOGLE_SERVICES_JSON so the built APK is connected to its Firebase.
      # (GOOGLE_SERVICES_JSON now belongs to the Coach Hub app in coaching-saas/.)
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ELEMENTS_GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            echo "::group::Compile errors"; grep -E "^e: " build.log || true; echo "::endgroup::"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
