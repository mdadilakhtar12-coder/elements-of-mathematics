name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: store your google-services.json (base64) as a repository secret
      # named GOOGLE_SERVICES_JSON so the built APK is connected to your Firebase.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Test, lint and build debug APK
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build.log || {
            echo "::group::Compile errors"; grep -E "^e: " build.log || true; echo "::endgroup::"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            build.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
