name: Coaching SaaS backend tests

on:
  push:
    paths: ['coaching-saas/functions/**', 'coaching-saas/firestore.rules', 'coaching-saas/firebase.json', '.github/workflows/coaching-saas-backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-saas/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: coaching-saas/functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:all
