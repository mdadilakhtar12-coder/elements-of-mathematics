name: Coaching SaaS deploy (Firebase)

# Run by hand: Actions tab -> "Coaching SaaS deploy (Firebase)" -> Run workflow.
# Needs ONE repository secret: FIREBASE_SERVICE_ACCOUNT (the deployer service account's JSON key).
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        options: [check-access, deploy-rules, deploy-functions, deploy-hosting, deploy-all, seed-plans, make-superadmin, backfill-teacher-ids, sync-plan-features, add-sha]
      email:
        description: "Only for make-superadmin: the Google e-mail (must have signed in once)"
        required: false
        default: ''
      sha:
        description: "Only for add-sha: a SHA-1 or SHA-256 fingerprint (AA:BB:...) to add to the Android app in Firebase"
        required: false
        default: ''

env:
  PROJECT: attendance-app-1cdf6

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coaching-saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Install functions dependencies
        run: npm ci
        working-directory: coaching-saas/functions

      - name: Check access (read-only)
        if: inputs.action == 'check-access'
        run: |
          npx --yes firebase-tools@13 projects:list --json | head -c 600
          echo; npx --yes firebase-tools@13 apps:list --project "$PROJECT"
          npx --yes firebase-tools@13 firestore:databases:list --project "$PROJECT"

      - name: Deploy Firestore rules
        if: inputs.action == 'deploy-rules' || inputs.action == 'deploy-all'
        run: npx --yes firebase-tools@13 deploy --only firestore --project "$PROJECT" --non-interactive

      - name: Deploy Cloud Functions
        if: inputs.action == 'deploy-functions' || inputs.action == 'deploy-all'
        run: npx --yes firebase-tools@13 deploy --only functions --project "$PROJECT" --non-interactive --force

      - name: Deploy Hosting (admin panel)
        if: inputs.action == 'deploy-hosting' || inputs.action == 'deploy-all'
        run: npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive

      - name: Seed plans
        if: inputs.action == 'seed-plans'
        run: node scripts/seed-plans.js
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT }}

      - name: Make super admin
        if: inputs.action == 'make-superadmin'
        run: node scripts/make-superadmin.js "${{ inputs.email }}"
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT }}

      # One-time after the security update: fills batches/{id}.teacherIds for batches created before it.
      - name: Backfill batch teacher ids
        if: inputs.action == 'backfill-teacher-ids'
        run: node scripts/backfill-teacher-ids.js
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT }}

      # After a new plan feature is added: gives existing institutes the missing feature keys (plan defaults).
      - name: Sync plan features
        if: inputs.action == 'sync-plan-features'
        run: node scripts/sync-plan-features.js
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT }}

      # Google sign-in needs the fingerprint of every key that signs the app (upload key, Play App Signing key).
      - name: Add SHA fingerprint to the Android app in Firebase
        if: inputs.action == 'add-sha'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -e
          echo "$SHA" | grep -Eq '^([0-9A-Fa-f]{2}:){19}[0-9A-Fa-f]{2}$|^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$' || { echo "::error::That does not look like a SHA-1 / SHA-256 fingerprint"; exit 1; }
          APP_ID=$(npx --yes firebase-tools@13 apps:list ANDROID --project "$PROJECT" --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).result.find(x=>x.packageName==='com.coachsaas.app');if(!a)process.exit(1);console.log(a.appId)})")
          npx --yes firebase-tools@13 apps:android:sha:create "$APP_ID" "$SHA" --project "$PROJECT"
          npx --yes firebase-tools@13 apps:android:sha:list "$APP_ID" --project "$PROJECT"
