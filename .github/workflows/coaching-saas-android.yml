name: Coaching SaaS Android

on:
  push:
    paths: ['coaching-saas/android/**', '.github/workflows/coaching-saas-android.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK to the "coachhub-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_LINK_DOMAIN: attendance-app-1cdf6.firebaseapp.com
    defaults:
      run:
        working-directory: coaching-saas/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      # Optional: secret GOOGLE_SERVICES_JSON connects the APK to your Firebase.
      # It may hold the plain google-services.json text OR its base64 - both work.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          first=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | head -c 1)
          if [ "$first" = "{" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          python3 -c "import json; d=json.load(open('app/google-services.json')); print('google-services.json OK for project', d['project_info']['project_id'], '- package(s):', [c['client_info']['android_client_info']['package_name'] for c in d['client']])" \
            || { echo "::error::GOOGLE_SERVICES_JSON secret is not valid JSON (plain or base64)"; exit 1; }

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            echo "::group::Compile errors"; grep -E "^e: |error:" build.log || true; echo "::endgroup::"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: coachhub-debug-apk
          path: coaching-saas/android/app/build/outputs/apk/debug/app-debug.apk

      # Fixed download link (no login needed):
      #   https://github.com/<owner>/<repo>/releases/download/coachhub-latest/CoachHub.apk
      - name: Publish APK to the coachhub-latest release
        if: github.ref == 'refs/heads/claude/android-education-app-f4iwdp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CoachHub.apk"
          gh release view coachhub-latest >/dev/null 2>&1 || gh release create coachhub-latest \
            --title "Coach Hub (latest debug APK)" --prerelease \
            --notes "Latest debug build of the Coach Hub Android app. Replaced on every build. Debug key - not for the Play Store."
          gh release upload coachhub-latest "$RUNNER_TEMP/CoachHub.apk" --clobber
