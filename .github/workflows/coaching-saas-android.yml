name: Coaching SaaS Android

on:
  push:
    paths: ['coaching-saas/android/**', '.github/workflows/coaching-saas-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_LINK_DOMAIN: attendance-app-1cdf6.firebaseapp.com
    defaults:
      run:
        working-directory: coaching-saas/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      # Optional: google-services.json (base64) as repo secret GOOGLE_SERVICES_JSON connects the APK to your Firebase.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            echo "::group::Compile errors"; grep -E "^e: |error:" build.log || true; echo "::endgroup::"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: coachhub-debug-apk
          path: coaching-saas/android/app/build/outputs/apk/debug/app-debug.apk
